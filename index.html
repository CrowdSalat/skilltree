<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Tree</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Search Bar with Filter Chips */
    .search-wrapper {
      position: fixed;
      top: 1.25rem;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .search-container {
      position: relative;
      width: 100%;
      max-width: 620px;
      margin: 0 1rem;
      pointer-events: auto;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.35rem;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 0.35rem 0.55rem 0.35rem 0.85rem;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-container:focus-within {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.22), 0 8px 30px rgba(0, 0, 0, 0.6);
    }

    .chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      align-items: center;
    }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      white-space: nowrap;
      animation: chipPop 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes chipPop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .chip-remove {
      background: none;
      border: none;
      color: #6ee7b7;
      opacity: 0.7;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
      padding: 0 0 1px 2px;
      display: inline-flex;
      align-items: center;
    }

    .chip-remove:hover {
      opacity: 1;
      color: #f87171;
    }

    .search-input {
      flex: 1;
      min-width: 140px;
      background: transparent;
      border: none;
      padding: 0.35rem 0.4rem;
      color: #f1f5f9;
      font-size: 0.875rem;
      outline: none;
      font-family: inherit;
    }

    .search-input::placeholder {
      color: #64748b;
    }

    /* Search Controls: Layout & Collapse Toggles & Clear Button */
    .search-actions {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-left: auto;
      flex-shrink: 0;
    }

    .collapse-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 0.72rem;
      font-weight: 500;
      padding: 0.22rem 0.6rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      white-space: nowrap;
    }

    .collapse-toggle-btn:hover {
      background: rgba(51, 65, 85, 0.8);
      color: #e2e8f0;
      border-color: #475569;
    }

    .collapse-toggle-btn .toggle-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #64748b;
      transition: all 0.2s ease;
    }

    /* Active State */
    .collapse-toggle-btn.is-active {
      background: rgba(56, 189, 248, 0.16);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .collapse-toggle-btn.is-active .toggle-dot {
      background-color: #38bdf8;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.8);
    }

    /* Disabled/Muted State (When no skill is selected) */
    .collapse-toggle-btn.is-disabled {
      opacity: 0.45;
    }

    .clear-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 1.15rem;
      cursor: pointer;
      display: none;
      padding: 0.1rem 0.3rem;
      line-height: 1;
      transition: color 0.15s ease;
    }

    .clear-btn:hover {
      color: #f1f5f9;
    }

    /* Viewport & Tree Canvas */
    #tree-viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: grab;
    }

    #tree-viewport:active {
      cursor: grabbing;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      user-select: none;
    }

    /* Connecting Lines */
    .link {
      fill: none;
      stroke: #26354d;
      stroke-width: 1.5px;
      transition: stroke 0.25s ease, stroke-width 0.25s ease, opacity 0.25s ease;
    }

    .link.is-path {
      stroke: #38bdf8 !important;
      stroke-width: 2.2px !important;
    }

    /* Node Badges */
    .node {
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .node-bg {
      fill: #111827;
      stroke: #293548;
      stroke-width: 1px;
      rx: 5px;
      ry: 5px;
      transition: fill 0.2s ease, stroke 0.2s ease;
    }

    .node:hover .node-bg {
      stroke: #64748b;
      fill: #1e293b;
    }

    .node-text {
      font-size: 11px;
      font-family: inherit;
      fill: #cbd5e1;
      dominant-baseline: central;
      pointer-events: none;
      transition: fill 0.2s ease, font-weight 0.2s ease;
    }

    .node-dot {
      fill: #475569;
      transition: fill 0.2s ease;
    }

    /* Highlight States */
    .node.is-match .node-bg {
      fill: #064e3b !important;
      stroke: #10b981 !important;
      stroke-width: 2px !important;
    }
    .node.is-match .node-text {
      fill: #ffffff !important;
      font-weight: 700 !important;
    }
    .node.is-match .node-dot {
      fill: #34d399 !important;
    }

    .node.is-path .node-bg {
      fill: #0c4a6e !important;
      stroke: #38bdf8 !important;
      stroke-width: 1.5px !important;
    }
    .node.is-path .node-text {
      fill: #f0f9ff !important;
      font-weight: 600 !important;
    }
    .node.is-path .node-dot {
      fill: #38bdf8 !important;
    }

    .tree-dimmed .node:not(.is-match):not(.is-path) {
      opacity: 0.65;
    }
    .tree-dimmed .node:not(.is-match):not(.is-path):hover {
      opacity: 1;
    }
    .tree-dimmed .link:not(.is-path) {
      opacity: 0.4;
    }

    /* Floating Hover Overlay Tooltip */
    .skill-tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid #334155;
      padding: 0.55rem 0.8rem;
      border-radius: 8px;
      font-size: 0.78rem;
      line-height: 1.45;
      max-width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.65);
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 100;
    }

    .skill-tooltip.is-visible {
      opacity: 1;
    }

    .skill-tooltip-title {
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 0.25rem;
      font-size: 0.82rem;
    }

    .skill-tooltip-desc {
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <!-- Single Top Search Bar -->
  <div class="search-wrapper">
    <div class="search-container" id="search-container">
      <div id="chips-container" class="chips-container"></div>
      <input 
        type="text" 
        id="search-input" 
        class="search-input" 
        placeholder="Type buzzword & press Enter, or click nodes..." 
        autocomplete="off"
        spellcheck="false"
      />
      <div class="search-actions">
        <button id="layout-toggle" class="collapse-toggle-btn is-active" type="button" title="Toggle Layout (2 Rows / 1 Row)">
          <span class="toggle-dot"></span>
          <span id="layout-toggle-text">2 Rows</span>
        </button>
        <button id="collapse-toggle" class="collapse-toggle-btn is-disabled" type="button" title="Select a skill to collapse">
          <span class="toggle-dot"></span>
          <span class="toggle-text">Collapse</span>
        </button>
        <button id="clear-btn" class="clear-btn" title="Clear all filters">&times;</button>
      </div>
    </div>
  </div>

  <!-- Unified Tree Viewport -->
  <div id="tree-viewport">
    <svg id="tree-svg"></svg>
  </div>

  <!-- Hover Tooltip Element -->
  <div id="skill-tooltip" class="skill-tooltip">
    <div id="tooltip-title" class="skill-tooltip-title"></div>
    <div id="tooltip-desc" class="skill-tooltip-desc"></div>
  </div>

  <script>
    // -------------------------------------------------------------
    // Fallback embedded taxonomy (used if skills.txt is blocked or absent)
    // -------------------------------------------------------------
    const DEFAULT_SKILLS_CONFIG = `
Cloud-Native & Platforms
  Base Containers
    LXD containers | Linux system container manager. Focuses on full OS containers rather than application microservices.
    Podman | Daemonless, rootless container engine. Red Hat standard drop-in replacement for Docker.
    Docker | Ubiquitous container engine and image format for packaging and running microservices.
    Buildah | Specialized tool for building OCI container images without needing a full daemon or root privileges.
    Skopeo | Utility for inspecting, copying, and signing container images directly between registries without local pulls.
  Orchestration
    Kubernetes / K8s | De facto standard container orchestrator managing deployments, scaling, and networking across clusters.
    Helm | Kubernetes package manager using templated charts for reusable multi-resource deployments.
    Kustomize | Template-free declarative configuration manager built directly into kubectl.
  Enterprise Platforms
    ArgoCD GitOps | Declarative continuous delivery using Git repositories as the source of truth (upstream of Red Hat OpenShift GitOps).
    Tekton Pipelines | Kubernetes-native CI/CD pipeline engine running stages as pods (upstream of Red Hat OpenShift Pipelines).
    Service Mesh Istio | Microservice traffic management, mTLS security, and telemetry (upstream of Red Hat OpenShift Service Mesh).
    Prometheus / Grafana / Loki / Tempo | Standard cloud-native observability stack for metrics, dashboards, logs, and distributed tracing.
    Red Hat Developer Hub / Backstage | Internal Developer Platform (IDP) providing self-service catalogs, software templates, and golden paths.
    Red Hat Devspaces / Eclipse Che | In-browser cloud development environments running containerized IDEs directly on OpenShift.
    Red Hat Trusted Artifact Signer | Cryptographic code and container image signing (Sigstore) ensuring software supply chain integrity.
    Red Hat Trusted Profile Analyzer | Vulnerability and SBOM management platform determining actual exploitability in application code.
    Red Hat Quay | Enterprise container registry featuring automated Clair vulnerability security scanning and geo-replication.
Application Runtimes
  Java & JVM
    Java SE / Maven | Core Java programming fundamentals, OOP principles, and standard project build/dependency management.
    Spring Boot / Hibernate | Mainstream enterprise Java framework and JPA/ORM persistence layer for standard backend microservices.
    Quarkus / GraalVM | "Supersonic Subatomic Java" optimized for Kubernetes, instant cold-starts, low RAM, and native compilation. Flagship modern Red Hat runtime.
    Jakarta EE / JBoss EAP / Wildfly / WebLogic / WebSphere | Traditional enterprise application servers. Signals legacy enterprise systems experience and migration readiness.
  Go (Golang)
    Operator SDK / Controllers | Framework for developing Kubernetes Operators to automate application operations inside OpenShift/K8s clusters.
    client-go / KubeBuilder | Core libraries for programmatically interacting with the Kubernetes API to build custom controllers.
    Gin / Fiber / gRPC | High-throughput, low-latency Go microservice frameworks and binary RPC communication protocols.
    Cobra CLI / Go Modules | Tooling for building modern command-line applications (like oc or kubectl) and modern Go dependency management.
  Python
    FastAPI / Pydantic | Modern async Python microservice framework with automatic OpenAPI documentation and strict data validation.
    LangChain / OpenShift AI | Frameworks for integrating LLMs into apps and deploying AI/ML workloads on Red Hat OpenShift AI (RHOAI).
    Jupyter Notebook / Jupyterlab | Interactive notebooks used by data scientists and developers to prototype data models and AI pipelines.
    Celery / AsyncIO | Distributed task queues and async event loops for asynchronous backend background processing.

  TypeScript & Node
    NestJS / Express | Server-side TypeScript/Node.js frameworks. NestJS brings Spring-like architectural structure to TypeScript.
    Backstage / RHDH Plugins | Custom plugin development for Developer Portals (Red Hat Developer Hub); platform engineering skill.
    React / Next.js | Modern web UI library and SSR framework for building customer-facing interfaces and developer portals.
Integration & Messaging
  APIs & Formats
    GraphQL | API query language allowing clients to request precisely the data fields needed from multiple backend sources.
    REST / OpenAPI | Industry standard HTTP API design principles and machine-readable contract documentation.
    gRPC | High-performance, binary RPC communication built on Protocol Buffers and HTTP/2 for inter-service communication.
  Message Brokers / Event Streaming
    ActiveMQ / AMQ | Classic enterprise message broker supporting JMS queues and message ordering (Red Hat AMQ Broker).
    RabbitMQ | Lightweight, popular message broker supporting AMQP routing and pub/sub patterns.
    Kafka / AMQ Streams / Strimzi | High-throughput distributed event streaming platform managed on K8s via Strimzi (Red Hat AMQ Streams).
    Debezium | Distributed Change Data Capture (CDC) platform capturing real-time row-level database changes into Kafka.
  Enterprise Integration
    Keycloak | Open-source Identity & Access Management (IAM) for OAuth2, OIDC, and SSO (Red Hat build of Keycloak).
    Apache Camel | Enterprise Integration Patterns (EIP) framework connecting hundreds of disparate technologies and legacy systems.
    Camel K | Lightweight, serverless-ready Camel integration runtime designed to run natively and instantly on Kubernetes.
    3scale | Red Hat API management platform for securing, rate-limiting, and managing developer access to APIs.
Testing & Reliability
  Unit & Core
    JUnit 5 / Jest | Standard unit testing frameworks for Java (JUnit 5) and JavaScript/TypeScript (Jest).
    Mockito | Dominant Java mocking framework for isolating and testing individual units of code.
    Selenium / playwright | Headless browser automation frameworks for end-to-end (E2E) UI and user journey testing.
  Integration & Containers
    Testcontainers | Spins up real, disposable containers (databases, Kafka, Keycloak) inside integration tests. Strong cloud-native signal.
    REST-Assured | Fluent Java DSL for testing and validating HTTP/REST endpoints.
    WireMock | HTTP mock server for stubbing external web services and third-party APIs during integration testing.
  Architecture & Contract
    ArchUnit | Java testing library that enforces package structure, layer boundaries, and coding conventions via unit tests.
    Pact / Microcks | Consumer-driven contract testing and API simulation ensuring microservices do not break each other's contracts.
    Cucumber | Behavior-Driven Development (BDD) testing tool using Gherkin plain-text syntax.
  Performance Testing
    Gatling | High-performance load and stress testing tool written as code for HTTP and web applications.
    k6 | Modern, developer-friendly load testing tool with test scripts written in JavaScript.
    JMeter | Established Apache performance and load testing tool widely used across enterprise organizations.

    let activeTaxonomyText = DEFAULT_SKILLS_CONFIG;

    // -------------------------------------------------------------
    // Hierarchy Parser: Indented Text -> Tree Data Structure
    // Supports "Skill Name | Description" format
    // -------------------------------------------------------------
    function parseIndentedTree(text, rootLabel = "Skills") {
      const lines = text.split('\n').filter(line => line.trim().length > 0);
      const root = { name: rootLabel, children: [], level: -1, id: "root", description: null };
      const stack = [root];
      let idSequence = 1;

      for (const line of lines) {
        const indentMatch = line.match(/^(\s*)/);
        const indent = indentMatch ? indentMatch[1].length : 0;
        const level = Math.floor(indent / 2);
        
        // Split name and optional description by '|'
        const rawContent = line.trim();
        const parts = rawContent.split(/\s*\|\s*/);
        const name = parts[0].trim();
        const description = parts.length > 1 ? parts.slice(1).join(' | ').trim() : null;

        const node = {
          id: 'node_' + (idSequence++),
          name: name,
          cleanName: name.toLowerCase(),
          description: description,
          level: level,
          children: []
        };

        while (stack.length > 1 && stack[stack.length - 1].level >= level) {
          stack.pop();
        }

        const parent = stack[stack.length - 1];
        parent.children.push(node);
        stack.push(node);
      }

      return root;
    }

    // -------------------------------------------------------------
    // D3 Unified Tree Rendering & Multi-Filter State
    // -------------------------------------------------------------
    const viewport = document.getElementById('tree-viewport');
    const svg = d3.select("#tree-svg");
    const searchInput = document.getElementById("search-input");
    const chipsContainer = document.getElementById("chips-container");
    const clearBtn = document.getElementById("clear-btn");
    const collapseBtn = document.getElementById("collapse-toggle");
    const layoutToggleBtn = document.getElementById("layout-toggle");
    const layoutToggleText = document.getElementById("layout-toggle-text");

    const tooltipEl = document.getElementById("skill-tooltip");
    const tooltipTitle = document.getElementById("tooltip-title");
    const tooltipDesc = document.getElementById("tooltip-desc");

    let allNodes = [], allLinks = [];
    let nodeSelection, linkSelection;
    let zoomBehavior, treeGroup;

    const activeFilters = new Set();
    let isCollapseActive = false;
    let layoutPreference = 'auto';
    let currentUseGrid = true;

    function getActiveSearchTerms() {
      const liveQuery = searchInput.value.trim().toLowerCase();
      const searchTerms = new Set(activeFilters);
      if (liveQuery) {
        liveQuery.split(/[\s,]+/).filter(t => t.length > 0).forEach(t => searchTerms.add(t));
      }
      return searchTerms;
    }

    function pruneTree(node, searchTerms, ancestorMatched = false) {
      const isDirectMatch = Array.from(searchTerms).some(term => 
        node.cleanName && node.cleanName.includes(term)
      );
      const selfMatches = isDirectMatch || ancestorMatched;

      let validChildren = [];
      if (node.children && node.children.length > 0) {
        for (const child of node.children) {
          const prunedChild = pruneTree(child, searchTerms, selfMatches);
          if (prunedChild !== null) {
            validChildren.push(prunedChild);
          }
        }
      }

      if (node.id === "root" || isDirectMatch || ancestorMatched || validChildren.length > 0) {
        return {
          ...node,
          children: validChildren,
          isDirectMatch: isDirectMatch
        };
      }

      return null;
    }

    function positionTooltip(event) {
      const pad = 14;
      let left = event.clientX + pad;
      let top = event.clientY + pad;

      const ttRect = tooltipEl.getBoundingClientRect();
      if (left + ttRect.width > window.innerWidth - 12) {
        left = event.clientX - ttRect.width - pad;
      }
      if (top + ttRect.height > window.innerHeight - 12) {
        top = event.clientY - ttRect.height - pad;
      }

      tooltipEl.style.left = `${Math.max(10, left)}px`;
      tooltipEl.style.top = `${Math.max(10, top)}px`;
    }

    function renderTree(animate = false) {
      svg.selectAll("*").remove();
      allNodes = [];
      allLinks = [];

      const rawTree = parseIndentedTree(activeTaxonomyText);
      const searchTerms = getActiveSearchTerms();
      const hasTokens = searchTerms.size > 0;
      const shouldCollapse = isCollapseActive && hasTokens;

      let treeSource = rawTree;
      if (shouldCollapse) {
        const pruned = pruneTree(rawTree, searchTerms);
        if (pruned && pruned.children && pruned.children.length > 0) {
          treeSource = pruned;
        }
      }

      const domainDataList = treeSource.children || [];
      if (domainDataList.length === 0) return;

      const isMonitor = window.innerWidth >= 960 && (window.innerWidth / window.innerHeight) >= 0.95;
      if (layoutPreference === 'grid') {
        currentUseGrid = true;
      } else if (layoutPreference === 'single') {
        currentUseGrid = false;
      } else {
        currentUseGrid = isMonitor && domainDataList.length > 1;
      }

      treeGroup = svg.append("g").attr("class", "tree-group");

      zoomBehavior = d3.zoom()
        .scaleExtent([0.3, 2.5])
        .on("zoom", (event) => {
          treeGroup.attr("transform", event.transform);
          tooltipEl.classList.remove("is-visible");
        });

      svg.call(zoomBehavior);
      svg.on("dblclick.zoom", null);
      svg.on("dblclick", () => fitAndCenter(true));

      const tempGroup = svg.append("g").attr("class", "temp-measure").style("visibility", "hidden");

      const domainsLayout = domainDataList.map(domainData => {
        const h = d3.hierarchy(domainData);

        let leafCount = 0;
        h.each(d => {
          if (!d.children || d.children.length === 0) leafCount++;
        });

        const nodeVerticalGap = 24;
        const domainHeight = Math.max(nodeVerticalGap * 1.5, leafCount * nodeVerticalGap);

        const d3Tree = d3.tree()
          .size([domainHeight, 1])
          .separation((a, b) => (a.parent === b.parent ? 1.0 : 1.15));

        d3Tree(h);

        h.descendants().forEach(d => {
          const tempText = tempGroup.append("text")
            .attr("font-size", "11px")
            .text(d.data.name);
          d.textWidth = tempText.node().getComputedTextLength();
          d.badgeWidth = Math.round(d.textWidth + 20);
        });

        const depthMaxWidth = {};
        h.descendants().forEach(d => {
          depthMaxWidth[d.depth] = Math.max(depthMaxWidth[d.depth] || 0, d.badgeWidth);
        });

        const maxDepth = d3.max(h.descendants(), d => d.depth) || 0;
        const depthOffsets = { 0: 0 };
        let currentX = 0;
        for (let lvl = 0; lvl <= maxDepth; lvl++) {
          depthOffsets[lvl] = currentX;
          currentX += (depthMaxWidth[lvl] || 140) + 26;
        }

        h.descendants().forEach(d => {
          d.y = depthOffsets[d.depth];
        });

        return {
          hierarchy: h,
          width: currentX,
          height: domainHeight
        };
      });

      tempGroup.remove();

      const gapX = 55;
      const gapY = 32;

      if (currentUseGrid && domainsLayout.length > 1) {
        const numCols = Math.ceil(domainsLayout.length / 2);
        const colWidths = [];
        const rowHeights = [];

        domainsLayout.forEach((item, i) => {
          const r = Math.floor(i / numCols);
          const c = i % numCols;
          colWidths[c] = Math.max(colWidths[c] || 0, item.width);
          rowHeights[r] = Math.max(rowHeights[r] || 0, item.height);
        });

        const colOffsets = [0];
        for (let c = 1; c < numCols; c++) {
          colOffsets[c] = colOffsets[c - 1] + colWidths[c - 1] + gapX;
        }

        const rowOffsets = [0];
        for (let r = 1; r < 2; r++) {
          rowOffsets[r] = rowOffsets[r - 1] + (rowHeights[r - 1] || 0) + gapY;
        }

        domainsLayout.forEach((item, i) => {
          const r = Math.floor(i / numCols);
          const c = i % numCols;
          item.offsetX = colOffsets[c];
          item.offsetY = rowOffsets[r];
        });
      } else {
        let accumulatedY = 0;
        domainsLayout.forEach(item => {
          item.offsetX = 0;
          item.offsetY = accumulatedY;
          accumulatedY += item.height + gapY;
        });
      }

      domainsLayout.forEach(item => {
        item.hierarchy.descendants().forEach(d => {
          d.y += item.offsetX;
          d.x += item.offsetY;
          allNodes.push(d);
        });
        allLinks.push(...item.hierarchy.links());
      });

      function horizontalLink(d) {
        const startX = d.source.y + (d.source.badgeWidth - 3);
        const startY = d.source.x;
        const endX = d.target.y - 3;
        const endY = d.target.x;
        const midX = (startX + endX) / 2;
        return `M ${startX} ${startY} C ${midX} ${startY}, ${midX} ${endY}, ${endX} ${endY}`;
      }

      linkSelection = treeGroup.selectAll(".link")
        .data(allLinks)
        .enter()
        .append("path")
        .attr("class", "link")
        .attr("d", horizontalLink);

      nodeSelection = treeGroup.selectAll(".node")
        .data(allNodes)
        .enter()
        .append("g")
        .attr("class", d => `node level-${d.depth}`)
        .attr("transform", d => `translate(${d.y},${d.x})`);

      nodeSelection.append("rect")
        .attr("class", "node-bg")
        .attr("x", -3)
        .attr("y", -10)
        .attr("width", d => d.badgeWidth)
        .attr("height", 20);

      nodeSelection.append("circle")
        .attr("class", "node-dot")
        .attr("cx", 4)
        .attr("cy", 0)
        .attr("r", 2);

      nodeSelection.append("text")
        .attr("class", "node-text")
        .attr("x", 12)
        .attr("y", 0)
        .text(d => d.data.name);

      // Node Interaction: Click toggles filter
      nodeSelection.on("click", (event, d) => {
        event.stopPropagation();
        tooltipEl.classList.remove("is-visible");
        toggleFilter(d.data.name);
      });

      // Hover Overlay for Descriptions
      nodeSelection
        .on("mouseenter", (event, d) => {
          if (d.data.description) {
            tooltipTitle.textContent = d.data.name;
            tooltipDesc.textContent = d.data.description;
            tooltipEl.classList.add("is-visible");
            positionTooltip(event);
          }
        })
        .on("mousemove", (event, d) => {
          if (d.data.description) {
            positionTooltip(event);
          }
        })
        .on("mouseleave", () => {
          tooltipEl.classList.remove("is-visible");
        });

      fitAndCenter(animate);
      updateToggleUI();
    }

    function fitAndCenter(animate = false) {
      if (!allNodes || allNodes.length === 0) return;

      const minX = d3.min(allNodes, d => d.y - 3) ?? 0;
      const maxX = d3.max(allNodes, d => d.y - 3 + d.badgeWidth) ?? 200;
      const minY = d3.min(allNodes, d => d.x - 10) ?? 0;
      const maxY = d3.max(allNodes, d => d.x + 10) ?? 200;

      const diagramWidth = Math.max(1, maxX - minX);
      const diagramHeight = Math.max(1, maxY - minY);
      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;

      const vpWidth = window.innerWidth;
      const vpHeight = window.innerHeight;

      const padTop = 85;
      const padBottom = 45;
      const padLeft = 45;
      const padRight = 45;

      const availWidth = Math.max(50, vpWidth - padLeft - padRight);
      const availHeight = Math.max(50, vpHeight - padTop - padBottom);

      const scaleX = availWidth / diagramWidth;
      const scaleY = availHeight / diagramHeight;

      let targetScale = Math.min(scaleX, scaleY, 1.05);
      targetScale = Math.max(0.35, targetScale);

      const vpCenterX = padLeft + availWidth / 2;
      const vpCenterY = padTop + availHeight / 2;

      const transX = vpCenterX - centerX * targetScale;
      const transY = vpCenterY - centerY * targetScale;

      const targetTransform = d3.zoomIdentity.translate(transX, transY).scale(targetScale);

      const currentTransform = d3.zoomTransform(svg.node());
      if (animate && currentTransform) {
        treeGroup.attr("transform", currentTransform);
        svg.transition()
          .duration(380)
          .ease(d3.easeCubicOut)
          .call(zoomBehavior.transform, targetTransform);
      } else {
        svg.call(zoomBehavior.transform, targetTransform);
      }
    }

    function updateToggleUI() {
      const hasTokens = getActiveSearchTerms().size > 0;
      collapseBtn.classList.toggle("is-active", isCollapseActive && hasTokens);
      collapseBtn.classList.toggle("is-disabled", !hasTokens);

      if (layoutToggleText) {
        layoutToggleText.textContent = currentUseGrid ? "2 Rows" : "1 Row";
        layoutToggleBtn.classList.toggle("is-active", currentUseGrid);
        layoutToggleBtn.title = currentUseGrid 
          ? "Layout: 2 Rows (Monitor). Click for 1 Row." 
          : "Layout: 1 Row (Mobile). Click for 2 Rows.";
      }

      if (!hasTokens) {
        collapseBtn.title = "Select a skill to collapse";
      } else if (isCollapseActive) {
        collapseBtn.title = "Expand all branches";
      } else {
        collapseBtn.title = "Collapse unselected branches";
      }
    }

    function addFilter(term) {
      const clean = term.trim();
      if (!clean) return;

      activeFilters.add(clean.toLowerCase());
      searchInput.value = "";
      renderChips();
      if (isCollapseActive) {
        renderTree(true);
      }
      applyHighlight();
      updateToggleUI();
    }

    function removeFilter(term) {
      activeFilters.delete(term.toLowerCase());
      renderChips();
      if (isCollapseActive) {
        renderTree(true);
      }
      applyHighlight();
      updateToggleUI();
    }

    function toggleFilter(term) {
      const lower = term.toLowerCase();
      if (activeFilters.has(lower)) {
        activeFilters.delete(lower);
      } else {
        activeFilters.add(lower);
      }
      renderChips();
      if (isCollapseActive) {
        renderTree(true);
      }
      applyHighlight();
      updateToggleUI();
    }

    function clearAllFilters() {
      activeFilters.clear();
      searchInput.value = "";
      renderChips();
      renderTree(true);
      applyHighlight();
      updateToggleUI();
    }

    function renderChips() {
      chipsContainer.innerHTML = "";
      activeFilters.forEach(filter => {
        const chip = document.createElement("span");
        chip.className = "filter-chip";
        chip.innerHTML = `${filter} <button class="chip-remove" title="Remove">&times;</button>`;
        chip.querySelector(".chip-remove").addEventListener("click", (e) => {
          e.stopPropagation();
          removeFilter(filter);
        });
        chipsContainer.appendChild(chip);
      });

      searchInput.placeholder = activeFilters.size > 0 
        ? "Add more..." 
        : "Type buzzword & press Enter, or click nodes...";
    }

    function applyHighlight() {
      const searchTerms = getActiveSearchTerms();
      const hasTokens = searchTerms.size > 0;

      clearBtn.style.display = hasTokens ? "block" : "none";

      if (!hasTokens) {
        svg.classed("tree-dimmed", false);
        nodeSelection.classed("is-match", false).classed("is-path", false);
        linkSelection.classed("is-path", false);
        return;
      }

      svg.classed("tree-dimmed", !isCollapseActive);

      const matchedNodes = new Set();
      const pathNodes = new Set();
      const pathLinks = new Set();

      allNodes.forEach(node => {
        const nodeName = node.data.cleanName;
        const isMatched = Array.from(searchTerms).some(term => nodeName && nodeName.includes(term));
        if (isMatched) {
          matchedNodes.add(node);
        }
      });

      matchedNodes.forEach(node => {
        let curr = node;
        while (curr.parent) {
          const parent = curr.parent;
          pathNodes.add(parent);

          allLinks.forEach(link => {
            if (link.source === parent && link.target === curr) {
              pathLinks.add(link);
            }
          });

          curr = parent;
        }
      });

      nodeSelection
        .classed("is-match", d => matchedNodes.has(d))
        .classed("is-path", d => pathNodes.has(d) && !matchedNodes.has(d));

      linkSelection
        .classed("is-path", d => pathLinks.has(d));
    }

    // Controls
    layoutToggleBtn.addEventListener("click", () => {
      layoutPreference = currentUseGrid ? 'single' : 'grid';
      renderTree(true);
      applyHighlight();
    });

    collapseBtn.addEventListener("click", () => {
      isCollapseActive = !isCollapseActive;
      renderTree(true);
      applyHighlight();
    });

    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === ",") {
        e.preventDefault();
        if (searchInput.value.trim()) {
          addFilter(searchInput.value.replace(/,/g, ""));
        }
      } else if (e.key === "Backspace" && searchInput.value === "" && activeFilters.size > 0) {
        const arr = Array.from(activeFilters);
        removeFilter(arr[arr.length - 1]);
      }
    });

    searchInput.addEventListener("input", () => {
      if (isCollapseActive) {
        renderTree();
      }
      applyHighlight();
      updateToggleUI();
    });

    clearBtn.addEventListener("click", () => {
      clearAllFilters();
      searchInput.focus();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        clearAllFilters();
      }
    });

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        renderTree();
        applyHighlight();
      }, 150);
    });

    // -------------------------------------------------------------
    // Initialization: Fetch skills.txt (with silent fallback to embedded string)
    // -------------------------------------------------------------
    async function initApp() {
      try {
        const resp = await fetch('./skills.txt');
        if (resp.ok) {
          const text = await resp.text();
          if (text.trim().length > 0) {
            activeTaxonomyText = text;
          }
        }
      } catch (err) {
        // Silently caught on file:/// or when skills.txt is absent.
      }
      renderTree();
    }

    window.onload = initApp;
  </script>
</body>
</html>
